name: AccuKnox Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Direct TruffleHog check
        id: direct
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            trufflesecurity/trufflehog:latest \
            git file:///repo --no-update \
            --results=verified,unknown,unverified,filtered_unverified \
            --json > direct-trufflehog.json || true

          COUNT=$(grep -c '"DetectorName"' direct-trufflehog.json || true)
          echo "count=${COUNT:-0}" >> "$GITHUB_OUTPUT"

      - name: Run AccuKnox Secret Scan
        id: accuknox
        continue-on-error: true
        uses: VanishaParwal/secret-scan-action-new@main
        with:
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          accuknox_label: "newsecret"
          additional_arguments: "--log-level=debug"
          upload_results: "true"
          soft_fail: "true"

      - name: Secret count summary
        if: always()
        env:
          DIRECT_COUNT: ${{ steps.direct.outputs.count }}
          ACCU_OUTCOME: ${{ steps.accuknox.outcome }}
        run: |
          if [ -f results.json ]; then
            ACCU=$(jq '[.runs[].results[].locations[0].physicalLocation.region.snippet.text] | unique | length' results.json)
            ACCU_LINES=$(jq '[.runs[].results[]] | length' results.json)
          else
            ACCU="n/a"
            ACCU_LINES="n/a"
          fi

          {
            echo "## Secret scan results"
            echo "| Scanner | Secrets found |"
            echo "|---|---|"
            echo "| Direct TruffleHog | ${DIRECT_COUNT:-0} |"
            echo "| AccuKnox action | ${ACCU} unique (findings: ${ACCU_LINES}) |"
            echo "| AccuKnox step outcome | ${ACCU_OUTCOME:-unknown} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
